# https://github.com/nginxinc/nginx-wiki/blob/0515cd76a4af01fdbcf283787ee7b43db7f2a1fe/source/start/topics/examples/phpfcgi.rst
add_header               X-Powered-By php always;
fastcgi_split_path_info  ^(.+?\.php)(/.*)$;

# https://serverfault.com/questions/627903/is-the-php-option-cgi-fix-pathinfo-really-dangerous-with-nginx-php-fpm
if (!-f $request_filename) {
    return 404;
}
try_files $uri =404;

fastcgi_param  HTTP_PROXY ""; # https://httpoxy.org

fastcgi_pass   unix:/run/php-fpm.sock;
fastcgi_index  index.php;

include        fastcgi_params;
fastcgi_param  SCRIPT_FILENAME $request_filename; # https://github.com/nginxinc/nginx-wiki/blob/4ead66e6363f149e700f9a2ca0340c64a657f8e0/source/start/topics/tutorials/config_pitfalls.rst#use-request_filename-for-script_filename
# fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name; # https://serverfault.com/questions/465607/nginx-document-rootfastcgi-script-name-vs-request-filename
