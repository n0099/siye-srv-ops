services:
  s6:
    extends:
      file: ../../base/s6.nginx.php-fpm/compose.yaml
      service: s6
    build:
      context: ../..
      dockerfile: srv/pma/Dockerfile
    volumes:
      - type: volume
        read_only: true
        source: data
        target: /var/www/config.inc.php
        volume:
          subpath: config.inc.php
volumes:
  data:
